name: GitHub Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 17sTomy
          filename: github-metrics.svg
          template: classic
          base: activity, repositories
          base_indepth: yes
          config_timezone: America/Argentina/Buenos_Aires
          plugin_lines: yes
          plugin_lines_delay: 30
          repositories_affiliations: owner, collaborator, organization_member
